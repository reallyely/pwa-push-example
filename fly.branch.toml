# fly.toml for branch preview environments — deployed via scripts/deploy-branch.sh
#
# Differs from fly.toml: no `app` (passed via --app at deploy time) and no
# [[mounts]] volume, since branch environments are throwaway and don't need
# persistent /data (DATA_DIR falls back to writable ephemeral container disk).

primary_region = 'iad'

[build]
[env]
  DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
