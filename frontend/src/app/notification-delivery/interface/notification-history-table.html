<h2>Notification History</h2>
<table>
  <thead>
    <tr>
      <th>Sent to</th>
      <th>Sent at</th>
      <th>Title</th>
      <th>Message</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    @if (notifications().length === 0) {
      <tr>
        <td colspan="5">No notifications sent yet</td>
      </tr>
    } @else {
      @for (n of notifications(); track n.id) {
        <tr>
          <td>{{ n.username }}</td>
          <td>{{ n.sentAt ? (n.sentAt | date: 'medium') : '—' }}</td>
          <td>{{ n.title }}</td>
          <td>{{ n.body }}</td>
          <td>{{ n.status }}</td>
        </tr>
      }
    }
  </tbody>
</table>
