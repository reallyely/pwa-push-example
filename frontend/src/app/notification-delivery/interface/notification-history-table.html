<h2>Notification History</h2>
<p-table [value]="notifications()">
  <ng-template #header>
    <tr>
      <th>Sent to</th>
      <th>Sent at</th>
      <th>Title</th>
      <th>Message</th>
      <th>Status</th>
    </tr>
  </ng-template>
  <ng-template #body let-n>
    <tr>
      <td>{{ n.username }}</td>
      <td>{{ n.sentAt ? (n.sentAt | date: 'medium') : '—' }}</td>
      <td>{{ n.title }}</td>
      <td>{{ n.body }}</td>
      <td><p-tag [value]="n.status" [severity]="statusSeverity(n.status)" /></td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5">No notifications sent yet</td>
    </tr>
  </ng-template>
</p-table>
