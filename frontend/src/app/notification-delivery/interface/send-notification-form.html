<form (ngSubmit)="submit()" novalidate>
  <label for="user">User</label>
  <p-select
    inputId="user"
    [options]="userOptions()"
    optionLabel="label"
    optionValue="value"
    [placeholder]="users().length === 0 ? 'No users registered yet' : 'Select a user'"
    [disabled]="users().length === 0"
    [ngModel]="selectedUserId()"
    (ngModelChange)="selectedUserId.set($event)"
    name="user"
    required
  />

  <label for="title">Title</label>
  <input pInputText id="title" type="text" name="title" [ngModel]="title()" (ngModelChange)="title.set($event)" required />

  <label for="body">Message</label>
  <input
    pInputText
    id="body"
    type="text"
    name="body"
    [ngModel]="body()"
    (ngModelChange)="body.set($event)"
    placeholder="Hello from the admin dashboard"
  />

  <label for="icon">Icon URL (optional)</label>
  <input
    pInputText
    id="icon"
    type="text"
    name="icon"
    [ngModel]="icon()"
    (ngModelChange)="icon.set($event)"
    placeholder="https://example.com/icon.png"
  />

  <label class="checkbox-label">
    <p-checkbox [binary]="true" name="scheduling" [ngModel]="scheduling()" (ngModelChange)="scheduling.set($event)" />
    Schedule for later
  </label>

  @if (scheduling()) {
    <label for="sendAt">Send at</label>
    <p-datepicker
      inputId="sendAt"
      name="sendAt"
      [ngModel]="sendAt()"
      (ngModelChange)="sendAt.set($event)"
      [showTime]="true"
      hourFormat="24"
      [showIcon]="true"
      required
    />
  }

  <p-button type="submit" [label]="submitLabel()" [disabled]="submitting()" [loading]="submitting()" />

  @if (status(); as msg) {
    <p-message [severity]="statusSeverity()" styleClass="status">{{ msg }}</p-message>
  }
</form>
