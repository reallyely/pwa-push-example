<h2>Scheduled Notifications</h2>
<p-table [value]="notifications()">
  <ng-template #header>
    <tr>
      <th>Sent to</th>
      <th>Send at</th>
      <th>Title</th>
      <th>Message</th>
      <th>Status</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-n>
    <tr>
      <td>{{ n.username }}</td>
      <td>{{ n.sendAt | date: 'medium' }}</td>
      <td>{{ n.title }}</td>
      <td>{{ n.body }}</td>
      <td><p-tag [value]="n.status" [severity]="statusSeverity(n.status)" /></td>
      <td>
        @if (n.status === 'pending') {
          <p-button type="button" label="Cancel" severity="danger" size="small" (onClick)="cancel.emit(n.id)" />
        }
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6">Nothing scheduled</td>
    </tr>
  </ng-template>
</p-table>
