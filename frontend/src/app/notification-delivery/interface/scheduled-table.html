<h2>Scheduled Notifications</h2>
<table>
  <thead>
    <tr>
      <th>Sent to</th>
      <th>Send at</th>
      <th>Title</th>
      <th>Message</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @if (notifications().length === 0) {
      <tr>
        <td colspan="6">Nothing scheduled</td>
      </tr>
    } @else {
      @for (n of notifications(); track n.id) {
        <tr>
          <td>{{ n.username }}</td>
          <td>{{ n.sendAt | date: 'medium' }}</td>
          <td>{{ n.title }}</td>
          <td>{{ n.body }}</td>
          <td>{{ n.status }}</td>
          <td>
            @if (n.status === 'pending') {
              <button type="button" (click)="cancel.emit(n.id)">Cancel</button>
            }
          </td>
        </tr>
      }
    }
  </tbody>
</table>
