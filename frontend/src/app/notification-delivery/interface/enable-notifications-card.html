<p-card header="Push Notifications" styleClass="enable-notifications-card">
  @if (message(); as msg) {
    <p-message [severity]="messageSeverity()" styleClass="status">{{ msg }}</p-message>
  }

  @if (canEnable()) {
    <p-button type="button" label="Enable notifications" (onClick)="enable()" />
  }
</p-card>
