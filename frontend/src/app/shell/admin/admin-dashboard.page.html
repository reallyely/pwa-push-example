<p>Logged in as {{ authStore.currentUser()?.email }} ({{ authStore.currentUser()?.role }}).</p>
<button type="button" (click)="logout()">Log out</button>

<p>Select a registered user and send them a push notification.</p>
<app-send-notification-form [users]="users()" />

<app-scheduled-table [notifications]="notificationsStore.scheduled()" (cancel)="onCancel($event)" />

<app-notification-history-table [notifications]="notificationsStore.history()" />
