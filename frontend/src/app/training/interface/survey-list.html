<h2>Surveys</h2>
<p-table [value]="surveys()">
  <ng-template #header>
    <tr>
      <th>Send date</th>
      <th>Training</th>
      <th>Questions</th>
      <th>Resources</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-s>
    <tr>
      <td>{{ s.sendDate | date: 'medium' }}</td>
      <td>{{ trainingLabel(s) }}</td>
      <td>{{ s.questions.length }}</td>
      <td>{{ s.resources.length }}</td>
      <td><a [routerLink]="['/admin/surveys', s.id, 'results']">View results &rarr;</a></td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5">No surveys created yet</td>
    </tr>
  </ng-template>
</p-table>
