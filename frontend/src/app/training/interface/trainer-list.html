<h2>Trainers</h2>
<p-table [value]="trainers()">
  <ng-template #header>
    <tr>
      <th>Name</th>
    </tr>
  </ng-template>
  <ng-template #body let-t>
    <tr>
      <td>{{ t.name }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="1">No trainers created yet</td>
    </tr>
  </ng-template>
</p-table>
