<form (ngSubmit)="submit()" novalidate>
  <h2>{{ heading() }}</h2>

  <label for="email">Email</label>
  <input
    pInputText
    id="email"
    type="email"
    name="email"
    [ngModel]="email()"
    (ngModelChange)="email.set($event)"
    autocomplete="email"
    required
  />

  <label for="password">Password</label>
  <p-password
    inputId="password"
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
    [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
    [feedback]="false"
    [toggleMask]="true"
    [fluid]="true"
    required
  />

  @if (mode() === 'register' && showRolePicker()) {
    <label for="role">Role</label>
    <p-select
      inputId="role"
      [options]="roleOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selectedRole()"
      (ngModelChange)="selectedRole.set($event)"
    />
  }

  <p-button type="submit" [label]="mode() === 'login' ? 'Log In' : 'Create Account'" [disabled]="submitting()" [loading]="submitting()" />

  <p-button type="button" [text]="true" [label]="mode() === 'login' ? 'Need an account? Create one' : 'Already have an account? Log in'" (onClick)="toggleMode()" />

  @if (error()) {
    <p-message severity="error">{{ error() }}</p-message>
  }
</form>
